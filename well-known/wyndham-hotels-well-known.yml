source: live probes of every Wyndham Hotels & Resorts host in apis.yml, 2026-07-28
note: |
  The consumer estate (wyndhamhotels.com and its subdomains) publishes no
  /.well-known/ discovery surface at all — every RFC-defined path returns 404, or
  an infrastructure status code that is not a document (503 from the Akamai-fronted
  mcp host, 403 from the WAF in front of aisearch, 204 from connect).

  The one real /.well-known/ surface on the Wyndham estate is on
  www.wyndhambusiness.com, the corporate-travel program site. It serves an RFC 8414
  OAuth 2.0 Authorization Server Metadata document and an RFC 9728 OAuth 2.0
  Protected Resource Metadata document, both HTTP 200 anonymously, both pointing at
  a WordPress MCP server route. Both are captured verbatim here. This is the first
  machine-readable authorization contract found anywhere on Wyndham's public
  properties and it was missed by the 2026-07-28 round-one review, which recorded
  wyndhambusiness.com only as "WAF blocks scripted clients" after probing HTML
  pages rather than the JSON surface.
