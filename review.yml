aid: wyndham-hotels
name: Wyndham Hotels & Resorts
review:
  question: >-
    Does Wyndham Hotels & Resorts publish a public developer portal, API
    documentation, or any machine-readable API contract — and what would it
    cost a customer to leave?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: hotel-group
  homeMarket: United States
  primaryDomain: wyndhamhotels.com

findings:
  summary: |
    No public API surface of any kind was found for Wyndham Hotels & Resorts
    on 2026-07-28. There is no developer portal, no API reference, no OpenAPI
    or Swagger document, no Postman collection, no SDK, no API terms of
    service, and no partner connectivity documentation reachable without a
    commercial relationship. The developer., developers., docs. and api.
    subdomains of wyndhamhotels.com do not resolve at all. Every conventional
    documentation path on the main site returns 404.

    Wyndham is a franchisor, not a distribution platform. Its central
    reservation system is Sabre Hospitality's SynXis CRS — Sabre publicly
    announced a long-term renewal on 2024-07-31 covering roughly 9,100 hotels
    and "nearly 70 million transactions annually", and reported migrating over
    5,000 properties to SynXis Property Hub. The consequence for API
    Evangelist purposes is that the programmable interface to Wyndham
    inventory is Sabre's, not Wyndham's. A partner integrates with Sabre (or
    with an OTA, or with the GDS chain codes) and never with a Wyndham API.

    The one machine-readable-ish artifact Wyndham does publish for automated
    consumers is an llms.txt at https://www.wyndhamhotels.com/llms.txt (HTTP
    200, 313 lines). It is a marketing/brand-orientation document — brand
    portfolio, loyalty tiers, booking guidance — and contains zero references
    to APIs, developers, partners, distribution, GDS, Sabre or channel
    connectivity. It is an AI-guidance document, not a contract.

    Wyndham's published Terms of Use go further than silence: they
    affirmatively prohibit automated access. This is the clearest statement of
    posture available and is quoted verbatim below.

  publicDeveloperSurface: false
  openapiHarvested: false
  specsCount: 0
  apisListed: 0

