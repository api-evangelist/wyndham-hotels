actions:
  openapiDirectoryCreated: false
  reason: >-
    No OpenAPI, Swagger, AsyncAPI, GraphQL schema, Postman collection or any
    other machine-readable API contract was found at any probed URL. Nothing
    real was harvested, so no openapi/ directory was created. Per the
    no-fabrication rule, no spec was generated, inferred, or reconstructed from
    documentation.
  apisYmlApisEmpty: true
  apisYmlReason: >-
    apis[] is intentionally empty. Wyndham Hotels & Resorts publishes no
    documented API. Listing an entry here would require inventing a host,
    endpoint or contract that does not exist publicly.
  recheckTriggers:
    - >-
      mcp.wyndhamhotels.com begins serving content — the host is provisioned
      behind Akamai and would be the first machine-facing surface Wyndham has
      exposed.
    - Any developer/developers/docs/api subdomain of wyndhamhotels.com begins to resolve.
    - llms.txt gains an API, developer, or partner-connectivity section.
    - Wyndham publishes GDS/connectivity documentation for distributors directly rather than via marketing PDFs.
