aid: wyndham-hotels
name: Wyndham Hotels & Resorts
kind: company
description: >-
  Wyndham Hotels & Resorts, Inc. (NYSE: WH) is the world's largest hotel
  franchising company by number of properties, with over 8,300 affiliated
  hotels and approximately 869,000 rooms across roughly 25 brands in 95+
  countries, licensed to more than 6,200 franchisees. Headquartered in
  Parsippany, New Jersey, its home market is the United States. Wyndham does
  not operate most of its hotels — it franchises brands (Days Inn, Super 8,
  Ramada, La Quinta, Microtel, Baymont, Howard Johnson, Travelodge, Wingate,
  Wyndham, Wyndham Grand, Trademark Collection, TRYP, Dolce, ECHO Suites and
  others) and sells the demand that flows through them. It sits in the
  distribution chain as a franchisor and demand aggregator rather than as a
  distribution platform: inventory reaches buyers through Wyndham's own
  brand.com sites and Wyndham Rewards, through GDS chain codes under master
  chain code WR, and through third-party online travel agents, with the
  central reservation layer supplied by Sabre Hospitality's SynXis CRS under a
  relationship Sabre publicly renewed in July 2024. There is no travel API:
  no developer portal, no API documentation, no OpenAPI, and no property,
  rate, availability, reservation, loyalty or folio surface is machine-readable
  anywhere. developer., developers., docs. and api. subdomains do not resolve;
  /developers, /api, /docs, /openapi.json, /swagger.json and /api-docs all
  return 404, and mcp.wyndhamhotels.com resolves with a valid certificate but
  serves an Akamai 503 on every path. The Terms of Use (effective 2026-03-12)
  affirmatively prohibit robots, spiders, meta-searching and automated access,
  and separately prohibit automated access to Wyndham's AI Search. What a
  second enrichment round did find on 2026-07-28 is undocumented CMS
  infrastructure that is nonetheless genuinely live: www.wyndhambusiness.com
  and development.wyndhamhotels.com both run WordPress on WP Engine and leave
  the WordPress REST API anonymously readable (309 and 403 registered routes,
  with JSON Schema available by HTTP OPTIONS), and three WordPress MCP adapter
  routes are registered across the two estates — one of them, on
  www.wyndhambusiness.com, bound to a real OAuth 2.1 authorization server with
  RFC 8414 and RFC 9728 discovery metadata, mandatory PKCE S256 and a single
  `mcp` scope, returning a standards-correct 401 bearer challenge to anonymous
  callers. None of it is documented, supported, or usable without a credential
  Wyndham issues to no third party, and none of it carries hotel data. The
  integration surface that matters is still reached only through a franchise
  agreement, a commercial distribution agreement, or Sabre.
