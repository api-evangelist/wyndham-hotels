apis:
  - aid: wyndham-hotels:wyndham-business-wordpress-rest-api
    name: Wyndham Business WordPress REST API
    description: >-
      www.wyndhambusiness.com — the Wyndham Business corporate-travel program
      site — runs WordPress on WP Engine behind Cloudflare and leaves the
      standard WordPress REST API anonymously readable at /wp-json/. The live
      route-discovery document advertises 309 routes across 12 namespaces, and
      anonymous HTTP 200 was verified on posts (489 records), pages, media,
      categories, tags, users, types, taxonomies, statuses, comments, blocks and
      search. HTTP OPTIONS on each collection returns a JSON Schema, eleven of
      which are harvested into json-schema/. Page-number pagination with
      X-WP-Total / X-WP-TotalPages and RFC 8288 Link headers; errors use the
      WordPress {code,message,data.status} envelope rather than RFC 9457. This is
      incidental CMS infrastructure, not a Wyndham API product — Wyndham
      documents, supports and issues keys for nothing, and the surface carries no
      property, rate, availability, reservation, loyalty or folio data. Settings
      and the wp-abilities registry return 401.
    humanURL: https://www.wyndhambusiness.com/
    baseURL: https://www.wyndhambusiness.com/wp-json/wp/v2
    tags:
      - Content
      - WordPress
      - REST
      - JSON
      - Business Travel
