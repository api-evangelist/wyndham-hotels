aid: wyndham-hotels
name: Wyndham Hotels & Resorts
kind: company
description: >-
  Wyndham Hotels & Resorts, Inc. (NYSE: WH) is the world's largest hotel
  franchising company by number of properties, with over 8,300 affiliated
  hotels and approximately 869,000 rooms across roughly 25 brands in 95+
  countries, licensed to more than 6,200 franchisees. Headquartered in
  Parsippany, New Jersey, its home market is the United States. Wyndham does
  not operate most of its hotels — it franchises brands (Days Inn, Super 8,
  Ramada, La Quinta, Microtel, Baymont, Howard Johnson, Travelodge, Wingate,
  Wyndham, Wyndham Grand, Trademark Collection, TRYP, Dolce, ECHO Suites and
  others) and sells the demand that flows through them. It sits in the
  distribution chain as a franchisor and demand aggregator rather than as a
  distribution platform: inventory reaches buyers through Wyndham's own
  brand.com sites and Wyndham Rewards, through GDS chain codes under master
  chain code WR, and through third-party online travel agents, with the
  central reservation layer supplied by Sabre Hospitality's SynXis CRS under a
  relationship Sabre publicly renewed in July 2024. Its API posture is honest
  and thin: as of 2026-07-28 no developer portal, no API documentation, no
  OpenAPI or other machine-readable contract, and no public API terms were
  found on wyndhamhotels.com or any probed subdomain. developer., developers.,
  docs. and api. subdomains do not resolve; /developers, /api, /docs,
  /openapi.json, /swagger.json and /api-docs all return 404. An
  mcp.wyndhamhotels.com host exists in certificate transparency and resolves
  but returns an Akamai 503 with no served content and no documentation. The
  published Terms of Use (effective 2026-03-12) affirmatively prohibit robots,
  spiders, meta-searching and other automated access, and separately prohibit
  automated access to Wyndham's AI Search. This is a no-public-API, no-exit-path
  provider whose integration surface is reached only through a franchise
  agreement, a commercial distribution agreement, or Sabre.
