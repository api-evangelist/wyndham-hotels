status: gated
note: 'Wyndham Hotels & Resorts does run MCP servers — three of them — and none is

  documented, advertised or usable by a third party.


  The substantive one is on www.wyndhambusiness.com, the corporate-travel program

  site. It is a WordPress MCP adapter that has been wired to a full OAuth 2.1

  authorization server: RFC 8414 authorization-server metadata and RFC 9728

  protected-resource metadata both return 200 anonymously, the protected resource

  names the MCP endpoint explicitly, PKCE S256 is required, public clients are

  supported via client_id_metadata_document, and the single advertised scope is

  `mcp`. An anonymous JSON-RPC tools/list returns 401 with a correct

  WWW-Authenticate: Bearer challenge carrying resource_metadata — a

  standards-correct MCP authorization handshake. No tool names, descriptions or

  inputSchemas can be read without a credential Wyndham issues to nobody, and none

  are published, so none are recorded here.


  A second WordPress MCP adapter route (mcp-adapter-default-server) is registered on

  the same site with no OAuth binding and returns 401 rest_forbidden.


  A third adapter is registered on development.wyndhamhotels.com, the franchise

  development site, also 401.


  Separately, mcp.wyndhamhotels.com resolves with a valid certificate but serves an

  Akamai 503 on every path — provisioned, never served.


  No tool list is derived as a candidate: this provider publishes no OpenAPI to

  derive one from, and inventing tools would be fabrication.

  '
