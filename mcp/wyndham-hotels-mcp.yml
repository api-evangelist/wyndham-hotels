source: 'https://www.wyndhambusiness.com/.well-known/oauth-protected-resource (HTTP 200,

  RFC 9728), https://www.wyndhambusiness.com/wp-json/mcp (HTTP 200, route

  discovery), and live JSON-RPC probes of both adapter endpoints, 2026-07-28

