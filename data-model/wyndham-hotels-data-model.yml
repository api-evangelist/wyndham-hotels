generated: '2026-07-28'
method: derived
source: |
  json-schema/wyndham-hotels-wp-v2-*.json (harvested by HTTP OPTIONS against
  https://www.wyndhambusiness.com/wp-json/wp/v2/*) plus GET /wp/v2/types and
  GET /wp/v2/taxonomies, 2026-07-28
note: |
  There is no hotel data model exposed by Wyndham Hotels & Resorts. This entity
  graph is derived strictly from the resource schemas the WordPress REST API on
  www.wyndhambusiness.com publishes, and it is a content-management model: posts,
  pages, media attachments, taxonomy terms, users and site metadata. No property,
  rate, availability, reservation, room-type, brand, loyalty-account or folio entity
  exists anywhere in a machine-readable Wyndham surface. That absence is the
  substantive finding — the entities a travel integrator actually wants live in
  Sabre Hospitality's SynXis CRS, which Wyndham buys rather than publishes.
rest_registered_types:
- name: post
  rest_base: posts
  schema: json-schema/wyndham-hotels-wp-v2-posts.json
  taxonomies:
  - category
  - post_tag
  records_observed: 489
  note: Wyndham Business news, hotel-opening and program articles.
- name: page
  rest_base: pages
  schema: json-schema/wyndham-hotels-wp-v2-pages.json
  taxonomies: []
- name: attachment
  rest_base: media
  schema: json-schema/wyndham-hotels-wp-v2-media.json
  note: Image and document corpus for the Wyndham Business site.
- name: comment
  rest_base: comments
  schema: json-schema/wyndham-hotels-wp-v2-comments.json
  note: Registered but returns an empty collection.
