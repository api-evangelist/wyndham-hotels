second_estate:
  host: https://development.wyndhamhotels.com
  note: |
    The franchise-development site runs the same WordPress core model with 403
    registered routes across 17 namespaces, adding WPML translation namespaces
    (wpml/v1, wpml/st/v1, wpml/tm/v1, wpml/ate/v1). Its entity graph is the same
    content model and is not duplicated here; the raw discovery document is captured
    at discovery/wyndham-hotels-development-wp-json-root.json.
