travel_entities:
  present: false
  absent:
  - property / hotel
  - brand
  - room type
  - rate plan
  - availability
  - reservation / booking
  - loyalty account (Wyndham Rewards)
  - folio / invoice
  - corporate account (Wyndham Direct)
  note: |
    None of these are registered with any Wyndham REST API. Hotel inventory reaches
    buyers through Sabre SynXis, GDS chain codes under master chain WR, brand.com
    and OTAs — none of which Wyndham exposes as a machine-readable contract.
